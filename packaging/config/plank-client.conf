# PLANK Client administrator policy
#
# This root-owned INI file is reserved for settings that an administrator
# wants to enforce. A commented or omitted key leaves the corresponding client
# preference user-configurable. An active key overrides the saved preference
# and disables that control in the client UI.

[network]
# Default TCP/UDP PLANK endpoint used when a bookmark address does not
# include an explicit port. Accepted range: 1024-65535.
port = 28989

# TCP port used for relay-mediated Wake PC requests. This must match
# relay.wake_port in /etc/plank/relay.conf on PLANK Relay appliances.
relay_wake_port = 28988

# Enable or disable local-network mDNS discovery. Accepted values: true, false.
# The client defaults this preference to false when the key is omitted.
# mdns_discovery = false
