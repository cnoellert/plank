# StationConnect workstation host configuration.
# This root-managed file is the single source of host runtime settings.

[network]
# Listener address family: ipv4 = IPv4 only; both = IPv4 and IPv6.
address_family = both
# Media encryption policy: 0 = never; 1 = when the client supports it;
# 2 = mandatory, rejecting clients that cannot encrypt.
# Scope uses the remote socket source address, not the route or physical path.
# The LAN policy applies to these remote source-address ranges:
#   127.0.0.0/8       IPv4 loopback
#   10.0.0.0/8        IPv4 private
#   172.16.0.0/12     IPv4 private
#   192.168.0.0/16    IPv4 private
#   100.64.0.0/10     IPv4 carrier-grade NAT
#   169.254.0.0/16    IPv4 link-local
#   ::1/128           IPv6 loopback
#   fc00::/7          IPv6 unique-local
#   fe80::/64         IPv6 link-local range recognized by StationConnect
# Every other remote source address uses the WAN policy. This is an address-scope
# decision, so a VPN client with a source such as 203.0.113.10 is considered LAN.
lan_encryption_mode = 0
wan_encryption_mode = 1
# Maximum time, in milliseconds, to wait for the client's initial media-channel
# pings or for activity from an established client. When the deadline expires,
# the host stops and cleans up that stream. Default: 10000 milliseconds.
ping_timeout = 10000
# Forward-error-correction parity added to each video frame, as a percentage of
# its data packets. Higher values can recover more packet loss but consume more
# network bandwidth and processing. Valid range: 1-255. Default: 20 percent.
fec_percentage = 20

[display]
# physical = preserve connected monitors; a remote session may temporarily
# lease a bookmark-selected layout that is restored at disconnect.
# virtual = initialize one internal 1920x1080 output for headless login; the
# authenticated bookmark selects the active display count and resolutions.
startup_layout = physical

[x264-encoder]
min_threads = 16
sw_preset = ultrafast
sw_tune = zerolatency
sw_vbv_maxrate_percentage = 150
sw_vbv_buffer_frames = 4
sw_scenecut = 40

[security]
# Root authentication is denied by default. Enabling it does not bypass the
# active-desktop ownership gate or the host's PAM/SSSD/HBAC policy.
allow_root_login = false
cert = /etc/stationconnect/tls/cert.pem
pkey = /etc/stationconnect/tls/key.pem
file_state = /var/lib/stationconnect/stationconnect_state.json

[discovery]
# Publish this host on the local network through mDNS/Avahi so compatible
# clients can discover it automatically. Accepted values: true or false.
# The default is false; manually configured hostname/IP bookmarks continue to
# work when discovery is disabled. Enabling this affects advertisement only and
# requires a working mDNS/Avahi service on the host network.
stationconnect_mdns_discovery = false

[logging]
log_path = /var/log/stationconnect/stationconnect-host.log
min_log_level = info
