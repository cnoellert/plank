# StationConnect workstation host configuration.
# This root-managed file is the single source of host runtime settings.

[network]
# Listener address family: ipv4 = IPv4 only; both = IPv4 and IPv6.
address_family = both

[display]
# Select only the boot-time display layout. Physical workstations may still
# lease bookmark-selected virtual layouts for the duration of a remote session.
startup_layout = physical
# Qualified 60 Hz values: 1024x2160, 1280x2160,
# 1920x1080, 1920x1200, 2560x1440, 2560x1600, 2560x2160, 3440x1440,
# 3840x1600, 3840x2160, 4096x2160, or 5120x2160. Output 2 remains hidden in a single-head
# layout but its EDID is prepared so a bookmark can activate it later.
virtual_mode_1 = 1920x1080
virtual_mode_2 = 1920x1080

[x264-encoder]
min_threads = 16
sw_preset = ultrafast
sw_tune = zerolatency
sw_vbv_maxrate_percentage = 150
sw_vbv_buffer_frames = 4
sw_scenecut = 40

[security]
# Root authentication is denied by default. Enabling it does not bypass the
# active-desktop ownership gate or the host's PAM/SSSD/HBAC policy.
allow_root_login = false
cert = /etc/stationconnect/tls/cert.pem
pkey = /etc/stationconnect/tls/key.pem
file_state = /var/lib/stationconnect/stationconnect_state.json

[discovery]
stationconnect_mdns_discovery = false

[logging]
log_path = /var/log/stationconnect/stationconnect-host.log
min_log_level = info
