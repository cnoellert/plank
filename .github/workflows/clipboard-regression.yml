name: Clipboard regressions

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x11-backend:
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:9.7@sha256:53f4c6dcb34e1403bd93207351f0af9a593610faeb7165cb8a037346765199b0
    timeout-minutes: 15
    steps:
      - name: Install isolated X11 test tools
        run: |
          dnf --disablerepo='*' \
            --repofrompath=ci-baseos,https://dl.rockylinux.org/vault/rocky/9.7/BaseOS/x86_64/os/ \
            --repofrompath=ci-appstream,https://dl.rockylinux.org/vault/rocky/9.7/AppStream/x86_64/os/ \
            --repofrompath=ci-crb,https://dl.rockylinux.org/vault/rocky/9.7/CRB/x86_64/os/ \
            --enablerepo=ci-baseos --enablerepo=ci-appstream --enablerepo=ci-crb \
            install -y git gcc-toolset-14-gcc-c++ pkgconf-pkg-config libX11-devel libxcb-devel libXfixes-devel xorg-x11-server-Xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact Host input
        run: git -c safe.directory="$GITHUB_WORKSPACE" submodule update --init apps/host/linux
      - name: Exercise production clipboard backend against Xvfb
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Iprotocol/plank-transport/include tests/protocol/clipboard-wire.c -o /tmp/clipboard-wire
          /tmp/clipboard-wire
          bash apps/host/linux/tests/clipboard/run-x11-backend.sh --negative-controls
