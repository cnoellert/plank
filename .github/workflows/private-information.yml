name: Private information checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Test the guard
        run: python3 tests/security/test-private-information.py
      - name: Check new commits and messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            head="$PR_HEAD"
          else
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
            # A history rewrite may remove the previous tip from this checkout.
            # Scan the complete new history; never fetch discarded private refs
            # or treat an unavailable/non-ancestor base as an empty change set.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$base" "$head"; then
              base=0000000000000000000000000000000000000000
            fi
          fi
          python3 scripts/maintenance/check-private-information.py --range "$base" "$head"
