# Qualification-only NVIDIA Xorg configuration for two virtual 4K outputs.
# Pass this file explicitly with Xorg -config; never replace xorg.conf with it.

Section "ServerLayout"
    Identifier "PLANK Headless Probe Layout"
    Screen 0 "PLANK Headless Probe Screen" 0 0
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "False"
    Option "AutoAddGPU" "False"
    Option "DontVTSwitch" "True"
EndSection

Section "Device"
    Identifier "PLANK NVIDIA GPU"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "ConnectedMonitor" "DFP-0, DFP-2"
    Option "UseDisplayDevice" "DFP-0, DFP-2"
    Option "CustomEDID" "DFP-0:/run/plank/headless-probe/virtual-1.edid; DFP-2:/run/plank/headless-probe/virtual-2.edid"
    Option "MetaModes" "DFP-0: 3840x2160 +0+0, DFP-2: 3840x2160 +3840+0"
    Option "nvidiaXineramaInfoOrder" "DFP-0, DFP-2"
    Option "HardDPMS" "False"
    Option "Interactive" "False"
EndSection

Section "Screen"
    Identifier "PLANK Headless Probe Screen"
    Device "PLANK NVIDIA GPU"
    DefaultDepth 30
    SubSection "Display"
        Depth 30
        Virtual 7680 2160
    EndSubSection
EndSection
