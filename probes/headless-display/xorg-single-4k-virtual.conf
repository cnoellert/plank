# Qualification-only NVIDIA Xorg configuration for one virtual 4K output.
# Pass this file explicitly with Xorg -config; never replace xorg.conf with it.

Section "ServerLayout"
    Identifier "StationConnect Headless Probe Layout"
    Screen 0 "StationConnect Headless Probe Screen" 0 0
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "False"
    Option "AutoAddGPU" "False"
    Option "DontVTSwitch" "True"
EndSection

Section "Device"
    Identifier "StationConnect NVIDIA GPU"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "ConnectedMonitor" "DFP-0"
    Option "UseDisplayDevice" "DFP-0"
    Option "CustomEDID" "DFP-0:/run/stationconnect/headless-probe/virtual-1.edid"
    Option "MetaModes" "DFP-0: 3840x2160 +0+0"
    Option "nvidiaXineramaInfoOrder" "DFP-0"
    Option "HardDPMS" "False"
    Option "Interactive" "False"
EndSection

Section "Screen"
    Identifier "StationConnect Headless Probe Screen"
    Device "StationConnect NVIDIA GPU"
    DefaultDepth 30
    SubSection "Display"
        Depth 30
        Virtual 3840 2160
    EndSubSection
EndSection
