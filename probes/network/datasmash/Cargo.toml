[package]
name = "connect-probe-datasmash"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["quinn-bbr"]
quinn-bbr = [
    "quinn-proto/stationconnect-bbr-default",
    "stationconnect-datasmash-transport/quinn-bbr",
]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
hex = "0.4"
kynet = { path = "../../../third_party/kyber-kymux/kynet", features = ["kynet-quinn"] }
quinn-proto = { version = "=0.11.17", default-features = false }
stationconnect-datasmash-transport = { path = "../../../protocol/datasmash-transport", default-features = false }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace]
exclude = ["vendor/quinn-proto-0.11.17"]

[patch.crates-io]
# quinn-proto 0.11.17 has two DATAGRAM send-buffer accounting defects that can
# abort a saturated connection under loss. Keep Kyber on its Quinn 0.11 API and
# use the narrow, documented backport in vendor/ until an upstream release
# contains the fixes.
quinn-proto = { path = "vendor/quinn-proto-0.11.17" }
